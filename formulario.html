<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Crédito</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a; color: #f1f5f9;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: #1e293b; padding: 32px 24px; border-radius: 16px;
    width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 20px; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 16px;
  }
  input:focus { outline: none; border-color: #38bdf8; }
  button {
    width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 10px;
    background: #38bdf8; color: #0f172a; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  button:active { background: #0ea5e9; }
  .mensaje { margin-top: 14px; font-size: 13px; text-align: center; }
  .mensaje.error { color: #f87171; }
  .mensaje.ok { color: #4ade80; }
</style>
</head>
<body>
  <div class="card">
    <h1>Datos de la solicitud</h1>
    <form id="miFormulario">
      <label for="valorCompra">Valor de compra</label>
      <input type="number" id="valorCompra" name="valorCompra" placeholder="Ej: 850000" required inputmode="numeric">

      <label for="cedula">Cédula</label>
      <input type="text" id="cedula" name="cedula" placeholder="Ej: 1017123456" required inputmode="numeric">

      <button type="submit" id="btnEnviar">Enviar</button>
      <div id="mensaje" class="mensaje"></div>
    </form>
  </div>

<script>
  // Configuración de GitHub (token embebido, según lo decidido)
  const GITHUB_TOKEN = "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";
  const GITHUB_USER = "landerojesus11-dev";
  const GITHUB_REPO = "celulander-datos";
  const ARCHIVO = "datos.json";

  const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ARCHIVO}`;

  const form = document.getElementById('miFormulario');
  const btn = document.getElementById('btnEnviar');
  const mensaje = document.getElementById('mensaje');

  async function leerArchivo() {
    const res = await fetch(API_URL, {
      headers: {
        Authorization: `Bearer ${GITHUB_TOKEN}`,
        Accept: "application/vnd.github+json"
      }
    });
    if (!res.ok) throw new Error("No se pudo leer datos.json (" + res.status + ")");
    const data = await res.json();
    const contenido = atob(data.content.replace(/\n/g, ""));
    return { lista: JSON.parse(contenido || "[]"), sha: data.sha };
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const valorCompra = document.getElementById('valorCompra').value.trim();
    const cedula = document.getElementById('cedula').value.trim();

    btn.disabled = true;
    btn.textContent = "Enviando...";
    mensaje.textContent = "";
    mensaje.className = "mensaje";

    try {
      const { lista, sha } = await leerArchivo();

      lista.push({
        valorCompra,
        cedula,
        fecha: new Date().toISOString()
      });

      const contenidoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(lista, null, 2))));

      const res = await fetch(API_URL, {
        method: "PUT",
        headers: {
          Authorization: `Bearer ${GITHUB_TOKEN}`,
          Accept: "application/vnd.github+json"
        },
        body: JSON.stringify({
          message: "Nueva solicitud registrada",
          content: contenidoBase64,
          sha: sha
        })
      });

      if (!res.ok) {
        const texto = await res.text();
        throw new Error("No se pudo guardar: " + texto);
      }

      mensaje.textContent = "✔ Guardado correctamente";
      mensaje.className = "mensaje ok";
      form.reset();

      setTimeout(() => {
        const params = new URLSearchParams({ valorCompra, cedula });
        window.location.href = 'resultado.html?' + params.toString();
      }, 800);

    } catch (err) {
      mensaje.textContent = "✖ " + err.message;
      mensaje.className = "mensaje error";
    } finally {
      btn.disabled = false;
      btn.textContent = "Enviar";
    }
  });
</script>
</body>
</html>
