<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos recibidos</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a; color: #f1f5f9;
    display: flex; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: #1e293b; padding: 32px 24px; border-radius: 16px;
    width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    height: fit-content;
  }
  h1 { font-size: 20px; margin: 0 0 20px; text-align: center; }
  h2 { font-size: 14px; color: #94a3b8; margin: 24px 0 10px; }
  .dato { background: #0f172a; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .dato span { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .dato strong { font-size: 18px; }
  .registro {
    background: #0f172a; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    font-size: 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .registro .cedula { color: #94a3b8; font-size: 12px; }
  a.volver { display: block; text-align: center; margin-top: 20px; color: #38bdf8; text-decoration: none; font-size: 14px; }
  #estado { text-align: center; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>Datos recibidos</h1>
    <div class="dato">
      <span>Valor de compra</span>
      <strong id="valorCompra">-</strong>
    </div>
    <div class="dato">
      <span>Cédula</span>
      <strong id="cedula">-</strong>
    </div>

    <h2>Historial (todas las solicitudes)</h2>
    <div id="estado">Cargando...</div>
    <div id="listaRegistros"></div>

    <a class="volver" href="formulario.html">← Volver al formulario</a>
  </div>

<script>
  const GITHUB_TOKEN = "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";
  const GITHUB_USER = "landerojesus11-dev";
  const GITHUB_REPO = "celulander-datos";
  const ARCHIVO = "datos.json";
  const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ARCHIVO}`;

  const params = new URLSearchParams(window.location.search);
  const valorCompra = params.get('valorCompra');
  const cedula = params.get('cedula');

  document.getElementById('valorCompra').textContent =
    valorCompra ? '$' + Number(valorCompra).toLocaleString('es-CO') : 'No recibido en esta URL';
  document.getElementById('cedula').textContent = cedula || 'No recibido en esta URL';

  async function cargarHistorial() {
    const estado = document.getElementById('estado');
    const lista = document.getElementById('listaRegistros');
    try {
      const res = await fetch(API_URL, {
        headers: {
          Authorization: `Bearer ${GITHUB_TOKEN}`,
          Accept: "application/vnd.github+json"
        }
      });
      if (!res.ok) throw new Error("No se pudo leer datos.json (" + res.status + ")");
      const data = await res.json();
      const contenido = atob(data.content.replace(/\n/g, ""));
      const datos = JSON.parse(contenido || "[]");

      estado.style.display = "none";

      if (!datos.length) {
        lista.innerHTML = '<div style="color:#94a3b8; font-size:13px;">Sin registros todavía.</div>';
        return;
      }

      lista.innerHTML = datos
        .slice()
        .reverse()
        .map(r => `
          <div class="registro">
            <div>
              $${Number(r.valorCompra).toLocaleString('es-CO')}
              <div class="cedula">CC ${r.cedula}</div>
            </div>
            <div class="cedula">${new Date(r.fecha).toLocaleString('es-CO')}</div>
          </div>
        `).join('');

    } catch (err) {
      estado.textContent = "✖ " + err.message;
    }
  }

  cargarHistorial();
</script>
</body>
</html>
